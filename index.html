<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 슬라이더</title>

  <!-- Pretendard 폰트 불러오기 (CDN) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    /* Pretendard 폰트 적용 및 기본 설정 */
    * {
      box-sizing: border-box;
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
    }

    body {
      background-color: #333;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    /* 슬라이더 전체 컨테이너 */
    .slider-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    /* 이미지 상단 인디케이터 (예: 1 / 8) */
    .image-counter {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #e0e0e0;
    }

    /* 슬라이더 영역 */
    .slider-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 이미지 스타일 */
    #slider-image {
      max-width: 800px;
      max-height: 600px;
      width: 100%;
      height: auto;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    /* 화살표 버튼 공통 스타일 */
    .arrow-btn {
      background: rgba(0, 0, 0, 0.5);
      border: none;
      color: white;
      font-size: 2rem;
      padding: 10px 18px;
      cursor: pointer;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border-radius: 50%;
      transition: background 0.3s ease, transform 0.2s ease;
      user-select: none;
    }

    .arrow-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .arrow-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    /* 좌우 화살표 위치 */
    .left-arrow {
      left: 15px;
    }

    .right-arrow {
      right: 15px;
    }
  </style>
</head>
<body>

  <div class="slider-wrapper">
    <!-- 상단 갯수 표시 영역 (1 / 8) -->
    <div class="image-counter" id="image-counter">1 / 1</div>

    <div class="slider-container">
      <button class="arrow-btn left-arrow" onclick="prevSlide()">&#10094;</button>
      <img src="" alt="슬라이드 이미지" id="slider-image">
      <button class="arrow-btn right-arrow" onclick="nextSlide()">&#10095;</button>
    </div>
  </div>

  <script>
    let currentIndex = 1; // 1번부터 시작 (img/img01.png)
    let totalImages = null; // 감지된 총 이미지 수

    const sliderImage = document.getElementById("slider-image");
    const counterElement = document.getElementById("image-counter");

    // 숫자 1 -> "01", 10 -> "10" 으로 변환해주는 함수
    function formatNumber(num) {
      return String(num).padStart(2, '0');
    }

    // 인디케이터 업데이트
    function updateCounter() {
      if (totalImages !== null) {
        counterElement.textContent = `${currentIndex} / ${totalImages}`;
      } else {
        counterElement.textContent = `${currentIndex} / ?`;
      }
    }

    // 이미지 로드 시도 함수 (img/ 폴더 경로 적용)
    function loadImage(index) {
      const fileName = `img/img${formatNumber(index)}.png`;
      sliderImage.src = fileName;
      updateCounter();
    }

    // 이미지 로드 실패 시 (마지막 이미지 다음 번호를 불렀을 때 처리)
    sliderImage.onerror = function () {
      if (totalImages === null && currentIndex > 1) {
        // 더 이상 이미지가 없음을 감지하여 바로 전 번호를 총 개수로 확정
        totalImages = currentIndex - 1;
        currentIndex = 1; // 첫 번째 이미지로 돌아감
        loadImage(currentIndex);
      } else if (totalImages !== null) {
        // 이미 총 개수를 아는 상태에서 에러 시 1번으로 복귀
        currentIndex = 1;
        loadImage(currentIndex);
      }
    };

    // 이전 이미지 이동
    function prevSlide() {
      if (currentIndex > 1) {
        currentIndex--;
        loadImage(currentIndex);
      } else if (totalImages !== null) {
        // 1번에서 이전 누를 경우 마지막 이미지로 이동
        currentIndex = totalImages;
        loadImage(currentIndex);
      }
    }

    // 다음 이미지 이동
    function nextSlide() {
      if (totalImages !== null) {
        currentIndex = (currentIndex % totalImages) + 1;
        loadImage(currentIndex);
      } else {
        // 아직 총 개수를 감지 중일 때
        currentIndex++;
        loadImage(currentIndex);
      }
    }

    // 최초 1번 이미지 로드 시작
    loadImage(currentIndex);
  </script>

</body>
</html>
